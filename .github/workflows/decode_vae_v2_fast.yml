name: MiniMax-H3 VAE Decoder (Fast BF16 + Live Heartbeat)

on:
  workflow_dispatch:
    inputs:
      latent_file:
        description: "Path or filename of the .safetensors latent file in repo"
        required: true
        default: "real_fox_latents.safetensors"
      output_name:
        description: "Name for the output MP4 video"
        required: true
        default: "fox_decoded_bf16.mp4"
      dtype:
        description: "Precision (bfloat16 uses AVX-512 hardware acceleration; float32 is legacy fallback)"
        required: true
        default: "bfloat16"
        type: choice
        options:
          - "bfloat16"
          - "float32"
      enable_tiling:
        description: "Enable spatial tiling (caps RAM overhead)"
        type: boolean
        required: true
        default: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  decode_fast:
    name: Fast BF16 CPU VAE Decode
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Runner Diagnostics & Swap Setup
        run: |
          echo "=== CPU Hardware ==="
          lscpu | grep -E "Model name|CPU\(s\):|Thread|Core"
          echo "=== Initial Memory ==="
          free -h
          
          echo "=== Allocating Additional 8GB Swap ==="
          sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          
          echo "=== Memory with Swap ==="
          free -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run MiniMax-H3 VAE Decode (BF16 + Live Heartbeat)
        run: |
          TILE_FLAG=""
          if [ "${{ inputs.enable_tiling }}" = "false" ]; then
            TILE_FLAG="--no-tile"
          fi
          python decode_minimax_h3.py "${{ inputs.latent_file }}" \
            --device cpu \
            --dtype "${{ inputs.dtype }}" \
            --output "${{ inputs.output_name }}" \
            $TILE_FLAG

      - name: Upload Decoded MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}
          retention-days: 14
