name: MiniMax-H3 VAE Decoder (Fast Float32 + Live Progress)

on:
  workflow_dispatch:
    inputs:
      latent_file:
        description: "Path or filename of the .safetensors latent file in repo"
        required: true
        default: "bookstore_latents.safetensors"
      output_name:
        description: "Name for the output MP4 video"
        required: true
        default: "bookstore_decoded.mp4"
      dtype:
        description: "Precision (float32 is recommended for CPU: 5x faster & pristine quality; bfloat16 causes software emulation & RoPE tearing)"
        required: true
        default: "float32"
        type: choice
        options:
          - "float32"
          - "bfloat16"
      tile_config:
        description: "Tiling Strategy (Fast 512x512 = ~2 tiles; Single 544x960 = 1 tile; Default 256x256 = ~15 tiles)"
        required: true
        default: "fast_512"
        type: choice
        options:
          - "fast_512"
          - "single_tile"
          - "default_256"
          - "no_tile"

env:
  PYTHONUNBUFFERED: "1"

jobs:
  decode_fast:
    name: Fast Float32 CPU VAE Decode
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Runner Diagnostics & Swap Setup
        run: |
          echo "=== CPU Hardware ==="
          lscpu | grep -E "Model name|CPU\(s\):|Thread|Core"
          echo "=== Initial Memory ==="
          free -h
          
          echo "=== Allocating Additional 8GB Swap ==="
          sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          
          echo "=== Memory with Swap ==="
          free -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run MiniMax-H3 VAE Decode (Float32 + Live Progress)
        run: |
          TILE_ARGS=""
          if [ "${{ inputs.tile_config }}" = "fast_512" ]; then
            TILE_ARGS="--tile-size 512 512"
          elif [ "${{ inputs.tile_config }}" = "single_tile" ]; then
            TILE_ARGS="--tile-size 544 960"
          elif [ "${{ inputs.tile_config }}" = "no_tile" ]; then
            TILE_ARGS="--no-tile"
          fi
          
          python decode_minimax_h3.py "${{ inputs.latent_file }}" \
            --device cpu \
            --dtype "${{ inputs.dtype }}" \
            --output "${{ inputs.output_name }}" \
            $TILE_ARGS

      - name: Upload Decoded MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}
          retention-days: 14
